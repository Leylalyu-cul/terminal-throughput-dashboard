<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal Throughput Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ====== 全局色彩 ====== */
:root {
  --navy: #0a1628;
  --navy-light: #132043;
  --navy-mid: #1b2d59;
  --accent-blue: #3b82f6;
  --accent-cyan: #06b6d4;
  --accent-green: #10b981;
  --accent-red: #ef4444;
  --accent-amber: #f59e0b;
  --bg-body: #f1f5f9;
  --card-shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --card-hover-shadow: 0 4px 12px rgba(0,0,0,0.08);
  --radius: 10px;
  --radius-sm: 6px;
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --border-color: #e2e8f0;
}

* { box-sizing: border-box; }

body {
  background: var(--bg-body);
  font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
  color: var(--text-primary);
  line-height: 1.6;
}

/* ====== 导航栏 ====== */
.navbar-dash {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
  padding: 0;
  position: sticky;
  top: 0;
  z-index: 1000;
  box-shadow: 0 2px 16px rgba(10,22,40,0.3);
}
.navbar-dash .navbar-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  max-width: 1600px;
  margin: 0 auto;
}
.navbar-dash .brand {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #fff;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.3px;
}
.navbar-dash .brand-icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.navbar-dash .nav-info {
  color: rgba(255,255,255,0.6);
  font-size: 13px;
}
.navbar-dash .badge-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent-green);
  margin-right: 6px;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

/* ====== 摘要卡片 ====== */
.summary-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.summary-card {
  background: #fff;
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--card-shadow);
  border-left: 4px solid var(--accent-blue);
  transition: box-shadow 0.2s, transform 0.2s;
}
.summary-card:hover {
  box-shadow: var(--card-hover-shadow);
  transform: translateY(-1px);
}
.summary-card .label {
  font-size: 12px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.summary-card .number {
  font-size: 26px;
  font-weight: 700;
  color: var(--navy);
  font-variant-numeric: tabular-nums;
}
.summary-card:nth-child(2) { border-left-color: var(--accent-cyan); }
.summary-card:nth-child(3) { border-left-color: var(--accent-amber); }
.summary-card:nth-child(4) { border-left-color: var(--accent-green); }

/* ====== 标签页 ====== */
.tabs-wrapper {
  background: #fff;
  border-radius: var(--radius) var(--radius) 0 0;
  box-shadow: var(--card-shadow);
  overflow: hidden;
}
.tab-nav {
  display: flex;
  gap: 0;
  padding: 0 16px;
  background: #f8fafc;
  border-bottom: 2px solid var(--border-color);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.tab-nav::-webkit-scrollbar { height: 3px; }
.tab-nav::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
.tab-btn {
  flex-shrink: 0;
  padding: 12px 18px;
  border: none;
  background: transparent;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  position: relative;
  transition: color 0.2s;
  white-space: nowrap;
}
.tab-btn:hover { color: var(--text-primary); }
.tab-btn.active {
  color: var(--accent-blue);
  font-weight: 600;
}
.tab-btn.active::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 12px; right: 12px;
  height: 3px;
  background: var(--accent-blue);
  border-radius: 3px 3px 0 0;
}

.tab-content-wrapper {
  padding: 16px;
}

/* ====== 面板 ====== */
.panel {
  background: #fff;
  border-radius: var(--radius);
  box-shadow: var(--card-shadow);
  overflow: hidden;
  margin-bottom: 14px;
}
.panel-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border-color);
  font-weight: 600;
  font-size: 14px;
  color: var(--text-primary);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.panel-header .sub {
  font-weight: 400;
  font-size: 12px;
  color: var(--text-secondary);
}

/* ====== 表格 ====== */
.table-wrap {
  overflow-x: auto;
  max-height: 580px;
  overflow-y: auto;
}
.table-wrap::-webkit-scrollbar { width: 5px; height: 5px; }
.table-wrap::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
.table-wrap table { width: 100%; font-size: 13px; border-collapse: collapse; }
.table-wrap thead { position: sticky; top: 0; z-index: 5; }
.table-wrap thead th {
  background: #f1f5f9;
  padding: 10px 12px;
  font-weight: 600;
  font-size: 12px;
  color: var(--text-secondary);
  text-align: left;
  border-bottom: 2px solid var(--border-color);
  white-space: nowrap;
}
.table-wrap tbody tr { transition: background 0.15s; }
.table-wrap tbody tr:hover { background: #eef2ff; }
.table-wrap tbody td {
  padding: 8px 12px;
  border-bottom: 1px solid #f1f5f9;
  vertical-align: middle;
}
.table-wrap tbody tr:nth-child(even) { background: #fafbfc; }
.table-wrap tbody tr:nth-child(even):hover { background: #eef2ff; }

/* ====== Region 行 ====== */
.region-row {
  background: #eef2ff !important;
  cursor: pointer;
  transition: background 0.15s;
}
.region-row:hover { background: #dde4ff !important; }
.region-row td {
  font-weight: 700;
  color: var(--navy);
  font-size: 13px;
  padding: 11px 12px;
  border-bottom: 2px solid var(--border-color);
}
.region-toggle {
  display: inline-block;
  width: 18px;
  text-align: center;
  font-size: 11px;
  color: var(--accent-blue);
  margin-right: 6px;
  transition: transform 0.2s;
}

/* ====== 子行折叠 ====== */
.port-row {
  display: table-row;
}
.port-row.collapsed { display: none; }

/* ====== 百分比 ====== */
.pct-up { color: var(--accent-green); font-weight: 600; }
.pct-down { color: var(--accent-red); font-weight: 600; }
.pct-up::before { content: '▲ '; font-size: 10px; }
.pct-down::before { content: '▼ '; font-size: 10px; }

/* ====== 搜索区 ====== */
.filter-bar {
  display: flex;
  gap: 8px;
  align-items: center;
}
.filter-bar input, .filter-bar select {
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  padding: 6px 12px;
  font-size: 13px;
  color: var(--text-primary);
  background: #fff;
  outline: none;
  transition: border-color 0.2s;
}
.filter-bar input:focus, .filter-bar select:focus {
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
}
.filter-bar input { width: 200px; }

/* ====== 加载遮罩 ====== */
.loading-overlay {
  position: fixed; inset: 0;
  background: rgba(15,23,42,0.7);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999;
}
.loading-overlay .loader {
  background: #fff;
  border-radius: var(--radius);
  padding: 32px 48px;
  text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}
.loading-overlay .spinner { width: 40px; height: 40px; border: 3px solid #e2e8f0; border-top-color: var(--accent-blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ====== 行号统计 ====== */
.count-badge {
  background: #e2e8f0;
  color: var(--text-secondary);
  border-radius: 20px;
  padding: 2px 10px;
  font-size: 12px;
  font-weight: 500;
}

/* ====== 响应式 ====== */
@media (max-width: 768px) {
  .navbar-dash .brand { font-size: 15px; }
  .summary-row { grid-template-columns: repeat(2, 1fr); }
  .tab-btn { padding: 10px 12px; font-size: 12px; }
  .summary-card .number { font-size: 22px; }
  .filter-bar { flex-wrap: wrap; }
  .filter-bar input { width: 100%; }
}
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar-dash">
  <div class="navbar-inner">
    <div class="brand">
      <div class="brand-icon">📊</div>
      <span>Terminal Throughput</span>
    </div>
    <div class="nav-info">
      <span class="badge-dot"></span>
      <span id="navInfo">加载中...</span>
    </div>
  </div>
</nav>

<div style="max-width:1600px; margin:16px auto; padding:0 16px;">

  <!-- Summary Cards -->
  <div class="summary-row" id="summaryCards">
    <div class="summary-card"><div class="label">总货量 (TEU)</div><div class="number" id="sumTotal">-</div></div>
    <div class="summary-card"><div class="label">总订舱 (TEU)</div><div class="number" id="sumBooking">-</div></div>
    <div class="summary-card"><div class="label">港口数</div><div class="number" id="sumPorts">-</div></div>
    <div class="summary-card"><div class="label">航线数</div><div class="number" id="sumLanes">-</div></div>
  </div>

  <!-- Tabs -->
  <div class="tabs-wrapper">
    <div class="tab-nav" id="tabNav">
      <button class="tab-btn active" data-tab="tabSource">📋 原始数据</button>
      <button class="tab-btn" data-tab="tabPortMonth">📅 Port x Month</button>
      <button class="tab-btn" data-tab="tabLaneMonth">🛤️ Lane x Month</button>
      <button class="tab-btn" data-tab="tabPortLaneType">📦 Port x Lane x Type</button>
      <button class="tab-btn" data-tab="tabYoyMom">📈 同比/环比</button>
      <button class="tab-btn" data-tab="tabWeekly">📉 Weekly Trend</button>
      <button class="tab-btn" data-tab="tabBooking">⚖️ Booking vs Actual</button>
    </div>
    <div class="tab-content-wrapper">

      <div class="tab-pane active" id="tabSource">
        <div class="panel">
          <div class="panel-header">
            <span>原始数据 <span class="count-badge" id="sourceCount">0</span></span>
            <div class="filter-bar">
              <select id="regionFilter"><option value="">全部区域</option></select>
              <input type="text" id="sourceSearch" placeholder="搜索港口/航线...">
            </div>
          </div>
          <div class="table-wrap"><table><thead id="sourceHeader"></thead><tbody id="sourceBody"></tbody></table></div>
        </div>
      </div>

      <div class="tab-pane" id="tabPortMonth">
        <div class="panel">
          <div class="panel-header"><span>Port x Month <span class="sub">按区域和港口汇总月度货量</span></span></div>
          <div class="table-wrap"><table id="portMonthTable"><thead id="portMonthHeader"></thead><tbody id="portMonthBody"></tbody></table></div>
        </div>
      </div>

      <div class="tab-pane" id="tabLaneMonth">
        <div class="panel">
          <div class="panel-header"><span>Lane x Month <span class="sub">按航线汇总月度货量</span></span></div>
          <div class="table-wrap"><table id="laneMonthTable"><thead id="laneMonthHeader"></thead><tbody id="laneMonthBody"></tbody></table></div>
        </div>
      </div>

      <div class="tab-pane" id="tabPortLaneType">
        <div class="panel">
          <div class="panel-header"><span>Port x Lane x Type <span class="sub">按区域、港口、航线、箱型、重/空分类</span></span></div>
          <div class="table-wrap"><table id="portLaneTypeTable"><thead id="portLaneTypeHeader"></thead><tbody id="portLaneTypeBody"></tbody></table></div>
        </div>
      </div>

      <div class="tab-pane" id="tabYoyMom">
        <div class="panel">
          <div class="panel-header"><span>同比/环比 <span class="sub">2026 vs 2025 月度货量对比</span></span></div>
          <div class="table-wrap"><table id="yoyMomTable"><thead id="yoyMomHeader"></thead><tbody id="yoyMomBody"></tbody></table></div>
        </div>
      </div>

      <div class="tab-pane" id="tabWeekly">
        <div class="panel">
          <div class="panel-header"><span>Weekly Trend <span class="sub">周度货量趋势</span></span></div>
          <div class="panel-body" style="padding:16px; position:relative; min-height:320px;">
            <canvas id="weeklyChart"></canvas>
          </div>
        </div>
        <div class="panel">
          <div class="panel-header"><span>周度明细</span></div>
          <div class="table-wrap"><table id="weeklyTable"><thead><tr><th>Week</th><th>Actual TEU</th></tr></thead><tbody id="weeklyBody"></tbody></table></div>
        </div>
      </div>

      <div class="tab-pane" id="tabBooking">
        <div class="panel">
          <div class="panel-header"><span>Booking vs Actual <span class="sub">按区域、港口对比订舱与实际</span></span></div>
          <div class="table-wrap"><table id="bookingTable"><thead id="bookingHeader"></thead><tbody id="bookingBody"></tbody></table></div>
        </div>
      </div>

    </div>
  </div>

</div>

<!-- Loading -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loader">
    <div class="spinner"></div>
    <div style="color:var(--text-secondary); font-size:14px;">正在加载吞吐量数据...</div>
  </div>
</div>

<script>
// ============================
// 数据
// ============================
let data2026 = [], dataYoyMom = [];
let weeklyChartInstance = null;

async function loadData() {
  try {
    const [r1, r2] = await Promise.all([
      fetch('data/data_2026.json').then(r => r.json()),
      fetch('data/data_yoy_mom.json').then(r => r.json()).catch(() => [])
    ]);
    data2026 = r1; dataYoyMom = r2;
    document.getElementById('loadingOverlay').style.display = 'none';
    renderAll();
  } catch(e) {
    try {
      const resp = await fetch('Terminal_Throughput_PivotTable_2025-2026_20260518_W21.xlsx');
      const buf = await resp.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      data2026 = XLSX.utils.sheet_to_json(wb.Sheets['Pivot Source (2026)']);
      document.getElementById('loadingOverlay').style.display = 'none';
      renderAll();
    } catch(e2) {
      document.getElementById('loadingOverlay').innerHTML = '<div style="color:var(--accent-red);">数据加载失败</div>';
    }
  }
}

// ============================
// 工具
// ============================
function sum(arr, key) { return arr.reduce((s, r) => s + (Number(r[key]) || 0), 0); }
function toNum(v) { return Number(v) || 0; }
function fmt(n) { return (n).toLocaleString(); }
function pct(v) { return (v >= 0 ? '+' : '') + (v * 100).toFixed(1) + '%'; }
function pctCell(v) {
  if (v == null || isNaN(v)) return '<td class="text-muted">-</td>';
  const cls = v >= 0 ? 'pct-up' : 'pct-down';
  return `<td class="${cls}">${(v * 100).toFixed(1)}%</td>`;
}

function groupBy(arr, keys, valKey) {
  const map = {};
  arr.forEach(r => {
    const k = keys.map(k => r[k] ?? '').join('|||');
    if (!map[k]) { map[k] = { sum: 0, rows: [] }; keys.forEach(ke => { map[k][ke] = r[ke] ?? ''; }); }
    map[k].sum += toNum(r[valKey]); map[k].rows.push(r);
  });
  return Object.values(map).sort((a, b) => b.sum - a.sum);
}

function pivotTable(arr, rowKeys, colKey, valKey) {
  const rowMap = {}, colSet = new Set();
  arr.forEach(r => {
    const rk = rowKeys.map(k => r[k] ?? '').join('|||');
    const ck = r[colKey] ?? ''; colSet.add(ck);
    if (!rowMap[rk]) rowMap[rk] = { _row: rowKeys.map(k => r[k] ?? ''), _cols: {} };
    rowMap[rk]._cols[ck] = (rowMap[rk]._cols[ck] || 0) + toNum(r[valKey]);
  });
  const cols = Array.from(colSet).sort();
  const rows = Object.values(rowMap).sort((a, b) => {
    const ta = cols.reduce((s, c) => s + (a._cols[c]||0), 0);
    const tb = cols.reduce((s, c) => s + (b._cols[c]||0), 0);
    return tb - ta;
  });
  return { rows, cols, rowKeys };
}

// 事件委托（折叠）
function setupToggle(tbody) {
  if (tbody._delegated) return;
  tbody._delegated = true;
  tbody.addEventListener('click', function(e) {
    const row = e.target.closest('.region-row');
    if (!row) return;
    const target = row.dataset.target;
    document.querySelectorAll('.' + target).forEach(c => c.classList.toggle('collapsed'));
    const tog = row.querySelector('.region-toggle');
    tog.textContent = tog.textContent === '▶' ? '▼' : '▶';
  });
}

// Tab 切换
function setupTabs() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      document.getElementById(this.dataset.tab).classList.add('active');
      if (this.dataset.tab === 'tabWeekly') renderWeekly(data2026);
    });
  });
}

// ============================
// 渲染
// ============================
function renderAll() {
  const d = data2026;
  const totalTEU = sum(d, 'Actual TEU');
  const totalBkg = sum(d, 'Booking TEU');
  const ports = new Set(d.map(r => r.Port));
  const lanes = new Set(d.map(r => r.Lane));
  document.getElementById('sumTotal').textContent = fmt(totalTEU);
  document.getElementById('sumBooking').textContent = fmt(totalBkg);
  document.getElementById('sumPorts').textContent = ports.size;
  document.getElementById('sumLanes').textContent = lanes.size;
  document.getElementById('navInfo').textContent = `${d.length} 条记录 · ${ports.size} 港口 · ${lanes.size} 航线`;

  const regions = [...new Set(d.map(r => r.Region))].sort();
  const sel = document.getElementById('regionFilter');
  regions.forEach(r => { sel.innerHTML += `<option value="${r}">${r}</option>`; });

  renderSourceData(d);
  renderPortMonth(d);
  renderLaneMonth(d);
  renderPortLaneType(d);
  if (dataYoyMom.length) renderYoyMom(dataYoyMom);
  renderWeekly(d);
  renderBooking(d);

  setupTabs();
}

// ---- Source Data ----
function renderSourceData(d) {
  const cols = ['Region','Port','Lane','TYPE','Load Status','ATD Month','Actual TEU','Booking TEU'];
  document.getElementById('sourceHeader').innerHTML = cols.map(c => `<th>${c}</th>`).join('');
  const tb = document.getElementById('sourceBody');
  function render(filterRegion='', search='') {
    let filtered = d;
    if (filterRegion) filtered = filtered.filter(r => r.Region === filterRegion);
    if (search) { const s = search.toLowerCase(); filtered = filtered.filter(r => (r.Port+'').toLowerCase().includes(s) || (r.Lane+'').toLowerCase().includes(s)); }
    document.getElementById('sourceCount').textContent = filtered.length + ' 行';
    tb.innerHTML = filtered.slice(0, 500).map(r => `<tr>${
      cols.map(c => `<td>${r[c] ?? ''}</td>`).join('')
    }</tr>`).join('');
    if (filtered.length > 500) tb.innerHTML += `<tr><td colspan="${cols.length}" style="text-align:center;color:var(--text-secondary);padding:12px;">仅显示前 500 行，共 ${filtered.length} 行</td></tr>`;
  }
  render();
  document.getElementById('sourceSearch').oninput = function() { render(document.getElementById('regionFilter').value, this.value); };
  document.getElementById('regionFilter').onchange = function() { render(this.value, document.getElementById('sourceSearch').value); };
}

// ---- Port x Month ----
function renderPortMonth(d) {
  const piv = pivotTable(d, ['Region','Port'], 'ATD Month', 'Actual TEU');
  document.getElementById('portMonthHeader').innerHTML = '<th>Region</th><th>Port</th>' + piv.cols.map(c => `<th>${c}</th>`).join('') + '<th>合计</th>';
  const tb = document.getElementById('portMonthBody');
  const regionMap = {};
  piv.rows.forEach(r => {
    const reg = r._row[0];
    if (!regionMap[reg]) regionMap[reg] = { region: reg, items: [], months: {}, total: 0 };
    regionMap[reg].items.push(r);
    piv.cols.forEach(c => { regionMap[reg].months[c] = (regionMap[reg].months[c]||0) + (r._cols[c]||0); });
    regionMap[reg].total += piv.cols.reduce((s,c) => s+(r._cols[c]||0), 0);
  });
  const regions = Object.values(regionMap).sort((a, b) => b.total - a.total);
  let idx = 0, html = '';
  regions.forEach(reg => {
    const regCells = piv.cols.map(c => `<td>${reg.months[c] ? fmt(reg.months[c]) : '-'}</td>`);
    html += `<tr class="region-row" data-target="pm${idx}"><td colspan="2"><span class="region-toggle">▶</span><strong>${reg.region}</strong> <span style="color:var(--text-secondary);font-size:11px;">${reg.items.length} 港口</span></td>${regCells.join('')}<td><strong>${fmt(reg.total)}</strong></td></tr>`;
    reg.items.forEach(r => {
      const cells = piv.cols.map(c => `<td>${r._cols[c] ? fmt(r._cols[c]) : '-'}</td>`);
      const total = piv.cols.reduce((s,c) => s+(r._cols[c]||0), 0);
      html += `<tr class="port-row pm${idx} collapsed"><td></td><td>${r._row[1]}</td>${cells.join('')}<td>${fmt(total)}</td></tr>`;
    });
    idx++;
  });
  tb.innerHTML = html;
  setupToggle(tb);
}

// ---- Lane x Month ----
function renderLaneMonth(d) {
  const piv = pivotTable(d, ['Lane'], 'ATD Month', 'Actual TEU');
  document.getElementById('laneMonthHeader').innerHTML = '<th>Lane</th>' + piv.cols.map(c => `<th>${c}</th>`).join('') + '<th>合计</th>';
  const tb = document.getElementById('laneMonthBody');
  tb.innerHTML = piv.rows.map(r => {
    const cells = piv.cols.map(c => `<td>${r._cols[c] ? fmt(r._cols[c]) : '-'}</td>`);
    const total = piv.cols.reduce((s,c) => s+(r._cols[c]||0), 0);
    return `<tr><td><strong>${r._row[0]}</strong></td>${cells.join('')}<td><strong>${fmt(total)}</strong></td></tr>`;
  }).join('');
}

// ---- Port x Lane x Type ----
function renderPortLaneType(d) {
  const groups = {};
  d.forEach(r => {
    const key = [r.Region, r.Port, r.Lane].join('|||');
    if (!groups[key]) groups[key] = { Region: r.Region, Port: r.Port, Lane: r.Lane, sub: {} };
    const subKey = `${r.TYPE}|${r['Load Status']}`;
    groups[key].sub[subKey] = (groups[key].sub[subKey] || 0) + toNum(r['Actual TEU']);
  });
  const allSubKeys = new Set();
  Object.values(groups).forEach(g => { Object.keys(g.sub).forEach(k => allSubKeys.add(k)); });
  const subKeys = [...allSubKeys].sort();
  document.getElementById('portLaneTypeHeader').innerHTML = '<th>Region</th><th>Port</th><th>Lane</th>' + subKeys.map(k => `<th>${k.replace('|', '<br>')}</th>`).join('') + '<th>合计</th>';

  const regionMap = {};
  Object.values(groups).forEach(g => {
    if (!regionMap[g.Region]) regionMap[g.Region] = { region: g.Region, ports: {} };
    if (!regionMap[g.Region].ports[g.Port]) regionMap[g.Region].ports[g.Port] = { port: g.Port, items: [] };
    regionMap[g.Region].ports[g.Port].items.push(g);
  });
  const regions = Object.values(regionMap).map(r => {
    const portArr = Object.values(r.ports).map(p => {
      p.total = p.items.reduce((s, g) => s + subKeys.reduce((t,k) => t+(g.sub[k]||0),0), 0);
      p.items.sort((a,b) => { const ta = subKeys.reduce((s,k)=>s+(a.sub[k]||0),0); const tb = subKeys.reduce((s,k)=>s+(b.sub[k]||0),0); return tb - ta; }); return p;
    }).sort((a, b) => b.total - a.total);
    r.portArr = portArr; r.total = portArr.reduce((s, p) => s + p.total, 0); return r;
  }).sort((a, b) => b.total - a.total);

  const tb = document.getElementById('portLaneTypeBody');
  let idx = 0, html = '';
  regions.forEach(r => {
    const regCells = subKeys.map(k => { const v = r.portArr.reduce((s, p) => s + p.items.reduce((t, g) => t+(g.sub[k]||0),0), 0); return `<td>${v ? fmt(v) : '-'}</td>`; });
    html += `<tr class="region-row" data-target="plt${idx}"><td colspan="3"><span class="region-toggle">▶</span><strong>${r.region}</strong> <span style="color:var(--text-secondary);font-size:11px;">${r.portArr.length} 港口</span></td>${regCells.join('')}<td><strong>${fmt(r.total)}</strong></td></tr>`;
    r.portArr.forEach(p => {
      const portCells = subKeys.map(k => { const v = p.items.reduce((t, g) => t+(g.sub[k]||0),0); return `<td>${v ? fmt(v) : '-'}</td>`; });
      const pTotal = p.items.reduce((s, g) => s + subKeys.reduce((t,k) => t+(g.sub[k]||0),0), 0);
      html += `<tr class="port-row plt${idx} collapsed"><td></td><td>${p.port}</td><td></td>${portCells.join('')}<td>${fmt(pTotal)}</td></tr>`;
      p.items.forEach(g => { const cells = subKeys.map(k => `<td>${g.sub[k] ? fmt(g.sub[k]) : '-'}</td>`); const total = subKeys.reduce((s,k) => s+(g.sub[k]||0), 0); html += `<tr class="port-row plt${idx} collapsed" style="font-size:12px;color:#64748b;"><td></td><td></td><td>${g.Lane}</td>${cells.join('')}<td>${fmt(total)}</td></tr>`; });
    });
    idx++;
  });
  tb.innerHTML = html;
  setupToggle(tb);
}

// ---- YoY / MoM ----
function renderYoyMom(data) {
  const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const hdr = document.getElementById('yoyMomHeader');
  let headerHtml = '<th>Region</th><th>Port</th>';
  for (let m = 0; m < 12; m++) {
    const mm = (m + 1).toString().padStart(2, '0');
    headerHtml += `<th>TEU<br><small>${mm}月</small></th><th>同比<br><small>vs 2025</small></th><th>环比<br><small>vs 上月</small></th>`;
  }
  hdr.innerHTML = headerHtml;

  const regionMap = {};
  const ports = [];
  data.forEach(r => {
    const row = { Region: r.Region, Port: r.Port, months: {} };
    for (let m = 0; m < 12; m++) {
      const mm = (m + 1).toString().padStart(2, '0');
      row.months[mm] = { teu: r[`teu_${mm}`] || 0, yoy: r[`yoy_${mm}`] || null, mom: r[`mom_${mm}`] || null };
    }
    row.total = Object.values(row.months).reduce((s, m) => s + m.teu, 0);
    ports.push(row);
    if (!regionMap[r.Region]) regionMap[r.Region] = { region: r.Region, ports: [] };
    regionMap[r.Region].ports.push(row);
  });

  const regions = Object.values(regionMap).map(r => {
    r.ports.sort((a, b) => b.total - a.total);
    r.total = r.ports.reduce((s, p) => s + p.total, 0);
    return r;
  }).sort((a, b) => b.total - a.total);

  const tb = document.getElementById('yoyMomBody');
  let idx = 0, html = '';

  regions.forEach(r => {
    let regCells = '';
    for (let m = 0; m < 12; m++) {
      const mm = (m + 1).toString().padStart(2, '0');
      const sum = r.ports.reduce((s, p) => s + p.months[mm].teu, 0);
      const yoyAvg = r.ports.reduce((s, p) => s + (p.months[mm].yoy || 0), 0) / r.ports.length;
      // mom for region: (this month total - prev month total) / prev month total
      const prevMm = m === 0 ? '01' : (m).toString().padStart(2, '0');
      const prevSum = m === 0 ? sum : r.ports.reduce((s, p) => s + p.months[prevMm].teu, 0);
      const momReg = prevSum > 0 ? (sum - prevSum) / prevSum : null;
      regCells += `<td><strong>${fmt(sum)}</strong></td>${pctCell(yoyAvg)}${pctCell(momReg)}`;
    }
    html += `<tr class="region-row" data-target="ym${idx}"><td colspan="2"><span class="region-toggle">▶</span><strong>${r.region}</strong> <span style="color:var(--text-secondary);font-size:11px;">${r.ports.length} 港口</span></td>${regCells}</tr>`;

    r.ports.forEach(p => {
      let cells = '';
      let prevTeu = null;
      for (let m = 0; m < 12; m++) {
        const mm = (m + 1).toString().padStart(2, '0');
        const mo = p.months[mm];
        cells += `<td>${fmt(mo.teu)}</td>${pctCell(mo.yoy)}`;
        // 环比：如果数据中有就用
        const momVal = prevTeu !== null && prevTeu > 0 ? (mo.teu - prevTeu) / prevTeu : null;
        cells += pctCell(momVal);
        prevTeu = mo.teu;
      }
      html += `<tr class="port-row ym${idx} collapsed"><td></td><td>${p.Port}</td>${cells}</tr>`;
    });
    idx++;
  });
  tb.innerHTML = html;
  setupToggle(tb);
}

// ---- Weekly Trend ----
function renderWeekly(d) {
  const weekly = groupBy(d, ['Week'], 'Actual TEU');
  weekly.sort((a, b) => (parseInt(a.Week,10)||0) - (parseInt(b.Week,10)||0));
  document.getElementById('weeklyBody').innerHTML = weekly.map(r => `<tr><td>Week ${r.Week}</td><td><strong>${fmt(r.sum)}</strong></td></tr>`).join('');

  if (weeklyChartInstance) weeklyChartInstance.destroy();
  const ctx = document.getElementById('weeklyChart').getContext('2d');
  weeklyChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: weekly.map(r => r.Week),
      datasets: [{
        label: 'Actual TEU',
        data: weekly.map(r => r.sum),
        borderColor: '#3b82f6',
        backgroundColor: 'rgba(59,130,246,0.08)',
        fill: true,
        tension: 0.4,
        pointRadius: 4,
        pointHoverRadius: 7,
        pointBackgroundColor: '#3b82f6',
        borderWidth: 2.5
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#0a1628',
          titleColor: '#fff',
          bodyColor: '#e2e8f0',
          cornerRadius: 8,
          padding: 10,
          callbacks: { label: ctx => fmt(ctx.parsed.y) + ' TEU' }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          title: { display: true, text: 'Week', color: '#64748b' },
          ticks: { color: '#64748b' }
        },
        y: {
          grid: { color: 'rgba(0,0,0,0.04)' },
          title: { display: true, text: 'TEU', color: '#64748b' },
          ticks: { color: '#64748b', callback: v => fmt(v) }
        }
      }
    }
  });
}

// ---- Booking vs Actual ----
function renderBooking(d) {
  document.getElementById('bookingHeader').innerHTML = '<th>Region</th><th>Port</th><th>Booking TEU</th><th>Actual TEU</th><th>Gap</th><th>Fulfill Rate</th>';
  const groups = {};
  d.forEach(r => {
    const key = [r.Region, r.Port].join('|||');
    if (!groups[key]) groups[key] = { Region: r.Region, Port: r.Port, booking: 0, actual: 0 };
    groups[key].booking += toNum(r['Booking TEU']);
    groups[key].actual += toNum(r['Actual TEU']);
  });

  const regionMap = {};
  Object.values(groups).forEach(g => {
    if (!regionMap[g.Region]) regionMap[g.Region] = { region: g.Region, ports: [] };
    regionMap[g.Region].ports.push(g);
  });
  const regions = Object.values(regionMap).map(r => {
    r.ports.sort((a, b) => b.actual - a.actual);
    r.booking = r.ports.reduce((s, p) => s + p.booking, 0);
    r.actual = r.ports.reduce((s, p) => s + p.actual, 0);
    return r;
  }).sort((a, b) => b.actual - a.actual);

  const tb = document.getElementById('bookingBody');
  let idx = 0, html = '';
  regions.forEach(r => {
    const regRate = r.booking > 0 ? (r.actual / r.booking * 100) : 0;
    html += `<tr class="region-row" data-target="bkg${idx}"><td colspan="2"><span class="region-toggle">▶</span><strong>${r.region}</strong> <span style="color:var(--text-secondary);font-size:11px;">${r.ports.length} 港口</span></td>
      <td><strong>${fmt(r.booking)}</strong></td><td><strong>${fmt(r.actual)}</strong></td>
      <td class="${r.actual >= r.booking ? 'pct-up' : 'pct-down'}"><strong>${r.actual >= r.booking ? '+' : ''}${fmt(r.actual - r.booking)}</strong></td>
      <td><strong>${regRate.toFixed(1)}%</strong></td></tr>`;
    r.ports.forEach(p => {
      const gap = p.actual - p.booking;
      const rate = p.booking > 0 ? (p.actual / p.booking * 100) : 0;
      html += `<tr class="port-row bkg${idx} collapsed"><td></td><td>${p.Port}</td>
        <td>${fmt(p.booking)}</td><td>${fmt(p.actual)}</td>
        <td class="${gap >= 0 ? 'pct-up' : 'pct-down'}">${gap >= 0 ? '+' : ''}${fmt(gap)}</td>
        <td class="${rate < 80 ? 'pct-down' : 'pct-up'}">${rate.toFixed(1)}%</td></tr>`;
    });
    idx++;
  });
  tb.innerHTML = html;
  setupToggle(tb);
}
