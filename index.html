<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal Throughput Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <!-- Flexmonster CSS -->
  <link rel="stylesheet" href="https://cdn.flexmonster.com/theme/light/flexmonster.min.css">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; }
    .tab-pane { min-height: 700px; padding: 16px; }
    .tab-content { border: 1px solid #dee2e6; border-top: none; background: #fff; }
    .fm-wrap { width: 100%; height: 600px; }
    #tab-weekly-trend .chart-wrap { width: 100%; height: 300px; margin-bottom: 16px; }
    .loading { text-align: center; padding: 80px; color: #666; font-size: 16px; }
    .nav-tabs .nav-link { font-size: 14px; font-weight: 500; }
  </style>
</head>
<body>

<div class="container-fluid p-3">
  <h4 class="mb-3">Terminal Throughput Dashboard</h4>

  <ul class="nav nav-tabs" id="mainTabs" role="tablist">
    <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#tab-port-month">Port x Month</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-lane-month">Lane x Month</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-port-lane-type">Port x Lane x Type</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-booking-actual">Booking vs Actual</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-weekly-trend">Weekly Trend</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-outbound">Outbound Report</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-inbound">Inbound Report</a></li>
  </ul>

  <div class="tab-content">

    <!-- Tab 1: Port x Month -->
    <div class="tab-pane fade show active" id="tab-port-month">
      <div id="fm-port-month" class="fm-wrap"></div>
    </div>

    <!-- Tab 2: Lane x Month -->
    <div class="tab-pane fade" id="tab-lane-month">
      <div id="fm-lane-month" class="fm-wrap"></div>
    </div>

    <!-- Tab 3: Port x Lane x Type -->
    <div class="tab-pane fade" id="tab-port-lane-type">
      <div id="fm-port-lane-type" class="fm-wrap"></div>
    </div>

    <!-- Tab 4: Booking vs Actual -->
    <div class="tab-pane fade" id="tab-booking-actual">
      <div id="fm-booking-actual" class="fm-wrap"></div>
    </div>

    <!-- Tab 5: Weekly Trend -->
    <div class="tab-pane fade" id="tab-weekly-trend">
      <div class="chart-wrap"><canvas id="chart-weekly-canvas"></canvas></div>
      <div id="fm-weekly" class="fm-wrap"></div>
    </div>

    <!-- Tab 6: Outbound -->
    <div class="tab-pane fade" id="tab-outbound">
      <div id="fm-outbound" class="fm-wrap"></div>
    </div>

    <!-- Tab 7: Inbound -->
    <div class="tab-pane fade" id="tab-inbound">
      <div id="fm-inbound" class="fm-wrap"></div>
    </div>

  </div><!-- /tab-content -->
</div><!-- /container -->

<!-- Bootstrap JS -->
<script src="https://unpkg.com/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Chart.js -->
<script src="https://unpkg.com/chart.js@4.4.0/dist/chart.umd.js"></script>
<!-- JSZip -->
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<!-- Flexmonster (no version number = official recommended path) -->
<script src="https://cdn.flexmonster.com/flexmonster.js"></script>

<script>
'use strict';

// ════════════════════════════════════════════════════════════════
//  DATA LOADING
// ════════════════════════════════════════════════════════════════
let rawData = [];
let weeklyChart = null;
let fmInstances = {}; // tabId -> Flexmonster instance

// Base field mapping (same for all raw-data tabs)
const BASE_MAPPING = {
  'Port':        { type: 'string' },
  'Lane':        { type: 'string' },
  'TYPE':        { type: 'string' },
  'Load Status': { type: 'string' },
  'ATD_Year':    { type: 'string' },
  'ATD Month':   { type: 'string' },
  'Week':        { type: 'string' },
  'COC-SOC':     { type: 'string' },
  'Actual TEU':  { type: 'number' },
  'Booking TEU': { type: 'number' },
  'Fulfill Rate':{ type: 'number' }
};

// OB/IB extended mapping (has computed fields)
const OBIB_MAPPING = Object.assign({}, BASE_MAPPING, {
  'Year':        { type: 'string' },
  'VS LY':       { type: 'number' },
  'VS LM':       { type: 'number' },
  'VS Last Year':{ type: 'number' },
  'VS Last Month':{ type: 'number' }
});

fetch('data/pivot_data.zip')
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status + ': pivot_data.zip not found'); return r.arrayBuffer(); })
  .then(buf => JSZip.loadAsync(buf))
  .then(zip => {
    const jf = zip.file('pivot_data.json');
    if (!jf) throw new Error('pivot_data.json not found inside zip');
    return jf.async('string');
  })
  .then(txt => JSON.parse(txt))
  .then(data => {
    rawData = data;
    initDashboard();
  })
  .catch(err => {
    document.body.innerHTML += '<div class="loading" style="color:#dc3545">Failed to load data: ' + err.message + '</div>';
  });


// ════════════════════════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════════════════════════
function prevYear(yr) {
  const y = parseInt(yr);
  return isNaN(y) ? '' : String(y - 1);
}

function prevMonth(mo) {
  if (!mo) return '';
  const [y, m] = mo.split('-').map(Number);
  if (isNaN(y) || isNaN(m)) return '';
  const d = new Date(y, m - 2, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

function buildYoYMoM(baseData, groupFields) {
  const agg = {};
  baseData.forEach(r => {
    const k = groupFields.map(f => (r[f] ?? '')).join('|');
    if (!agg[k]) { agg[k] = { ...r, 'Actual TEU': 0 }; }
    agg[k]['Actual TEU'] += (r['Actual TEU'] || 0);
  });
  const valMap = {};
  Object.values(agg).forEach(r => {
    const k = groupFields.map(f => (r[f] ?? '')).join('|');
    valMap[k] = r['Actual TEU'];
  });
  return Object.values(agg).map(r => {
    const k = groupFields.map(f => (r[f] ?? '')).join('|');
    const lyKey = [prevYear(r.ATD_Year), r['ATD Month']].join('|');
    const lmKey = [r.ATD_Year, prevMonth(r['ATD Month'])].join('|');
    r['VS LY'] = r['Actual TEU'] - (valMap[lyKey] || 0);
    r['VS LM'] = r['Actual TEU'] - (valMap[lmKey] || 0);
    r['Year'] = r['ATD_Year'];
    r['VS Last Year'] = r['VS LY'];
    r['VS Last Month'] = r['VS LM'];
    return r;
  });
}


// ════════════════════════════════════════════════════════════════
//  FLEXMONSTER FACTORY
// ════════════════════════════════════════════════════════════════
function makeFlexmonster(divId, data, mapping, slice) {
  const container = document.getElementById(divId);
  container.innerHTML = ''; // clear previous

  // Destroy old instance if any
  if (fmInstances[divId]) {
    try { fmInstances[divId].dispose(); } catch(e) {}
    fmInstances[divId] = null;
  }

  const pivot = new Flexmonster({
    container: '#' + divId,
    componentFolder: 'https://cdn.flexmonster.com/',
    dataSource: {
      data: data,
      mapping: mapping
    },
    slice: slice,
    options: {
      toolbar: true,
      showGrandTotals: 'on',
      showRowTotals: 'on',
      showColumnTotals: 'on'
    }
  });

  fmInstances[divId] = pivot;
  return pivot;
}


// ════════════════════════════════════════════════════════════════
//  INIT DASHBOARD
// ════════════════════════════════════════════════════════════════
function initDashboard() {

  // ── Weekly chart (Chart.js) ───────────────────────────────
  function drawWeeklyChart() {
    const weekly = {};
    rawData.forEach(r => {
      const w = String(r['Week'] || '');
      if (!w) return;
      if (!weekly[w]) weekly[w] = { 'Actual TEU': 0, 'Booking TEU': 0 };
      weekly[w]['Actual TEU']  += (Number(r['Actual TEU'])  || 0);
      weekly[w]['Booking TEU'] += (Number(r['Booking TEU']) || 0);
    });
    const rows = Object.entries(weekly)
      .map(([w, v]) => ({ Week: w, 'Actual TEU': v['Actual TEU'], 'Booking TEU': v['Booking TEU'] }))
      .sort((a, b) => parseInt((a.Week||'').replace(/\D/g,'')) - parseInt((b.Week||'').replace(/\D/g,'')));

    const ctx = document.getElementById('chart-weekly-canvas').getContext('2d');
    if (weeklyChart) weeklyChart.destroy();
    weeklyChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: rows.map(r => r.Week),
        datasets: [
          { label: 'Actual TEU',  data: rows.map(r => r['Actual TEU']),  borderColor: '#2c5aa0', backgroundColor: 'rgba(44,90,160,0.1)', fill: true, tension: 0.3, pointRadius: 4 },
          { label: 'Booking TEU', data: rows.map(r => r['Booking TEU']), borderColor: '#e67e22', backgroundColor: 'rgba(230,126,34,0.1)', fill: true, tension: 0.3, pointRadius: 4 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: true }, tooltip: { callbacks: { label: c => c.dataset.label + ': ' + c.parsed.y.toLocaleString() } } },
        scales: { y: { beginAtZero: true, title: { display: true, text: 'TEU' } }, x: { title: { display: true, text: 'Week' } } }
      }
    });
  }
  drawWeeklyChart();

  // ── Pre-compute OB / IB ───────────────────────────────────
  const obData = buildYoYMoM(
    rawData.filter(r => ['OUT', 'T/S OUT'].includes(r['TYPE'])),
    ['Port', 'ATD_Year', 'ATD Month']
  );
  const ibData = buildYoYMoM(
    rawData.filter(r => ['IN', 'T/S IN'].includes(r['TYPE'])),
    ['Port', 'ATD_Year', 'ATD Month']
  );

  // ══ Tab 1: Port x Month ══════════════════════════════════
  makeFlexmonster('fm-port-month', rawData, BASE_MAPPING, {
    rows:    ['Port'],
    columns: ['ATD Month'],
    measures: [{ uniqueName: 'Actual TEU', aggregation: 'sum' }],
    filters: [{ uniqueName: 'ATD_Year', filter: { members: ['2026'] } }]
  });

  // ══ Tab 2: Lane x Month ═══════════════════════════════════
  makeFlexmonster('fm-lane-month', rawData, BASE_MAPPING, {
    rows:    ['Lane'],
    columns: ['ATD Month'],
    measures: [{ uniqueName: 'Actual TEU', aggregation: 'sum' }],
    filters: [{ uniqueName: 'ATD_Year', filter: { members: ['2026'] } }]
  });

  // ══ Tab 3: Port x Lane x Type ═════════════════════════════
  makeFlexmonster('fm-port-lane-type', rawData, BASE_MAPPING, {
    rows:    ['Port', 'Lane'],
    columns: ['TYPE', 'Load Status'],
    measures: [{ uniqueName: 'Actual TEU', aggregation: 'sum' }],
    filters: [{ uniqueName: 'ATD_Year', filter: { members: ['2026'] } }]
  });

  // ══ Tab 4: Booking vs Actual ══════════════════════════════
  makeFlexmonster('fm-booking-actual', rawData, BASE_MAPPING, {
    rows:    ['Port'],
    columns: [],
    measures: [
      { uniqueName: 'Booking TEU', aggregation: 'sum' },
      { uniqueName: 'Actual TEU',  aggregation: 'sum' },
      { uniqueName: 'Fulfill Rate', aggregation: 'average' }
    ],
    filters: [{ uniqueName: 'ATD_Year', filter: { members: ['2026'] } }]
  });

  // ══ Tab 5: Weekly Trend ════════════════════════════════════
  // (chart drawn above, Flexmonster shows weekly breakdown)
  makeFlexmonster('fm-weekly', rawData, BASE_MAPPING, {
    rows:    ['Week'],
    columns: [],
    measures: [
      { uniqueName: 'Actual TEU',  aggregation: 'sum' },
      { uniqueName: 'Booking TEU', aggregation: 'sum' }
    ],
    filters: [{ uniqueName: 'ATD_Year', filter: { members: ['2026'] } }]
  });

  // ══ Tab 6: Outbound Report ══════════════════════════════════
  makeFlexmonster('fm-outbound', obData, OBIB_MAPPING, {
    rows:    ['Port', 'Year', 'ATD Month'],
    columns: [],
    measures: [
      { uniqueName: 'Actual TEU',     aggregation: 'sum' },
      { uniqueName: 'VS LY',          aggregation: 'sum' },
      { uniqueName: 'VS LM',         aggregation: 'sum' }
    ]
  });

  // ══ Tab 7: Inbound Report ══════════════════════════════════
  makeFlexmonster('fm-inbound', ibData, OBIB_MAPPING, {
    rows:    ['Port', 'Year', 'ATD Month'],
    columns: [],
    measures: [
      { uniqueName: 'Actual TEU',     aggregation: 'sum' },
      { uniqueName: 'VS LY',          aggregation: 'sum' },
      { uniqueName: 'VS LM',         aggregation: 'sum' }
    ]
  });

}
</script>
</body>
</html>
