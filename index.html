<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal Throughput Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <!-- PivotTable.js CSS -->
  <link rel="stylesheet" href="https://unpkg.com/pivottable@2.23.0/dist/pivot.min.css">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; }
    .tab-pane { min-height: 700px; padding: 16px; }
    .tab-content { border: 1px solid #dee2e6; border-top: none; background: #fff; }
    .pivot-wrap { width: 100%; min-height: 580px; overflow: auto; max-height: 70vh; }
    #tab-weekly-trend .chart-wrap { width: 100%; height: 300px; margin-bottom: 16px; }
    .nav-tabs .nav-link { font-size: 14px; font-weight: 500; }
    /* PivotTable.js overrides */
    .pvtUi { font-size: 13px; }
    .pvtTable { font-size: 12px; }
    .pvtTable td, .pvtTable th { padding: 4px 8px; white-space: nowrap; }
    .pvtAxisContainer { background: #f7f9fc; border: 1px solid #d0d7de; }
    .pvtFilterBox { z-index: 9999; }
    .loading { text-align: center; padding: 80px; color: #666; font-size: 16px; }
    /* ── Sticky header & column ─────────────────────────────────────────── */
    /* Column headers — sticky top */
    .pvtTable thead th {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #f7f9fc;
    }
    /* Left row-label column — sticky left */
    .pvtTable tbody th {
      position: sticky;
      left: 0;
      z-index: 5;
      background: white;
    }
    /* Top-left cell: both top + left */
    .pvtTable thead th:first-child,
    .pvtTable thead th.pvtRowLabel {
      position: sticky;
      top: 0;
      left: 0;
      z-index: 20;
      background: #f7f9fc;
    }
    /* Row-total (right side) columns — sticky right */
    .pvtTable td.colTotal,
    .pvtTable th.colTotal {
      position: sticky;
      right: 0;
      z-index: 6;
      background: #fff8e1;
    }
    /* Grand-total header cell — top + right */
    .pvtTable thead th.colTotal {
      position: sticky;
      top: 0;
      right: 0;
      z-index: 21;
      background: #fff8e1;
    }
    /* Subtotal rows: "Σ XXXX Total" — highlight blue */
    tr.subtotal-row td { background: #ddeeff !important; font-weight: bold; color: #1a3a6c; }
    tr.subtotal-row td:first-child { color: #1a3a6c; }
    /* ── Collapse toggle ───────────────────────────────────────────────────── */
    .pvtRowLabel[rowspan] { cursor: pointer; user-select: none; }
    .pvtRowLabel[rowspan]:hover { background: #cfe2ff !important; }
    .pvtRowLabel[rowspan] .collapse-arrow { margin-right: 4px; font-size: 11px; color: #555; }
    tr.pivot-group-hidden { display: none; }
  </style>
</head>
<body>

<div class="container-fluid p-3">
  <h4 class="mb-3">Terminal Throughput Dashboard</h4>

  <ul class="nav nav-tabs" id="mainTabs" role="tablist">
    <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#tab-port-month">Port x Month</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-lane-month">Lane x Month</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-port-lane-type">Port x Lane x Type</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-booking-actual">Booking vs Actual</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-weekly-trend">Weekly Trend</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-outbound">Outbound Report</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-inbound">Inbound Report</a></li>
  </ul>

  <div class="tab-content">

    <!-- Tab 1: Port x Month -->
    <div class="tab-pane fade show active" id="tab-port-month">
      <div id="pv-port-month" class="pivot-wrap"></div>
    </div>

    <!-- Tab 2: Lane x Month -->
    <div class="tab-pane fade" id="tab-lane-month">
      <div id="pv-lane-month" class="pivot-wrap"></div>
    </div>

    <!-- Tab 3: Port x Lane x Type -->
    <div class="tab-pane fade" id="tab-port-lane-type">
      <div id="pv-port-lane-type" class="pivot-wrap"></div>
    </div>

    <!-- Tab 4: Booking vs Actual -->
    <div class="tab-pane fade" id="tab-booking-actual">
      <div id="pv-booking-actual" class="pivot-wrap"></div>
    </div>

    <!-- Tab 5: Weekly Trend -->
    <div class="tab-pane fade" id="tab-weekly-trend">
      <div class="chart-wrap"><canvas id="chart-weekly-canvas"></canvas></div>
      <div id="pv-weekly" class="pivot-wrap"></div>
    </div>

    <!-- Tab 6: Outbound -->
    <div class="tab-pane fade" id="tab-outbound">
      <div id="pv-outbound" class="pivot-wrap"></div>
    </div>

    <!-- Tab 7: Inbound -->
    <div class="tab-pane fade" id="tab-inbound">
      <div id="pv-inbound" class="pivot-wrap"></div>
    </div>

  </div><!-- /tab-content -->
</div><!-- /container -->

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<!-- JSZip -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<!-- jQuery (required by PivotTable.js) -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<!-- jQuery UI (required for drag-drop) -->
<script src="https://cdn.jsdelivr.net/npm/jquery-ui@1.13.2/dist/jquery-ui.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jquery-ui@1.13.2/themes/smoothness/jquery-ui.min.css">
<!-- PivotTable.js -->
<script src="https://cdn.jsdelivr.net/npm/pivottable@2.23.0/dist/pivot.min.js"></script>

<script>
'use strict';

let rawData = [];
let weeklyChart = null;
let pvInit = {}; // tabId -> boolean, whether pivot was already rendered

// ─── helpers ─────────────────────────────────────────────────────────────────
function filterYear(data, year) {
  return data.filter(function(r) { return String(r['ATD_Year']) === String(year); });
}

function prevYear(yr) {
  var y = parseInt(yr);
  return isNaN(y) ? '' : String(y - 1);
}

function prevMonth(mo) {
  if (!mo) return '';
  var parts = mo.split('-').map(Number);
  var y = parts[0], m = parts[1];
  if (isNaN(y) || isNaN(m)) return '';
  var d = new Date(y, m - 2, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

function buildYoYMoM(baseData) {
  // Aggregate by Port + ATD_Year + ATD Month
  var agg = {};
  baseData.forEach(function(r) {
    var port  = String(r['Port']       || '');
    var year  = String(r['ATD_Year']   || '');
    var month = String(r['ATD Month']  || '');
    var k = port + '|' + year + '|' + month;
    if (!agg[k]) {
      agg[k] = {
        'Port': port, 'ATD_Year': year, 'ATD Month': month,
        'Actual TEU': 0
      };
    }
    agg[k]['Actual TEU'] += (Number(r['Actual TEU']) || 0);
  });

  // Build lookup map
  var valMap = {};
  Object.keys(agg).forEach(function(k) {
    valMap[k] = agg[k]['Actual TEU'];
  });

  return Object.values(agg).map(function(r) {
    var port  = r['Port'];
    var year  = r['ATD_Year'];
    var month = r['ATD Month'];
    var lyKey = port + '|' + prevYear(year) + '|' + month;
    var lmKey = port + '|' + year + '|' + prevMonth(month);
    var ly = valMap[lyKey] || 0;
    var lm = valMap[lmKey] || 0;
    r['VS LY']  = r['Actual TEU'] - ly;
    r['VS LM']  = r['Actual TEU'] - lm;
    return r;
  });
}

// ─── Inject Port / Lane Subtotal Rows ────────────────────────────────────────
// For each group (e.g. each Port), inject a synthetic "AEJEA汇总" row containing the sum.
// This makes PivotTable.js display a Port-total row after all its lanes.
function injectSubtotals(data, groupByField) {
  if (!data || data.length === 0) return data;

  var numFields = null;  // lazy-detect numeric fields from first row

  // Group rows by the groupByField
  var groups = {};
  data.forEach(function(r) {
    var g = String(r[groupByField] || '');
    if (!g) return;
    if (!groups[g]) groups[g] = [];
    groups[g].push(r);
  });

  var result = [];
  Object.keys(groups).sort().forEach(function(g) {
    var rows = groups[g];
    // Detect numeric fields once
    if (!numFields) {
      numFields = {};
      Object.keys(rows[0]).forEach(function(k) {
        var v = rows[0][k];
        numFields[k] = (typeof v === 'number' || !isNaN(parseFloat(v))) && isFinite(v);
      });
    }
    // Add all original rows
    rows.forEach(function(r) { result.push(r); });
    // Add subtotal row: copy first row, override group key + lane + numeric sums
    var total = {};
    Object.keys(rows[0]).forEach(function(k) {
      if (k === groupByField) {
        total[k] = g;
      } else if (k === 'Lane') {
        total[k] = 'Σ ' + g + ' Total';   // Σ (Sigma) sorts after all regular lanes alphabetically
      } else if (numFields[k]) {
        total[k] = rows.reduce(function(s, r) { return s + (parseFloat(r[k]) || 0); }, 0);
      } else {
        total[k] = '';
      }
    });
    total['_isSubtotal'] = true;  // marker for CSS
    result.push(total);
  });

  return result;
}

// ─── PivotTable.js factory ───────────────────────────────────────────────────
function makePivot(divId, data, cfg) {
  var $el = $('#' + divId);
  $el.empty();

  $el.pivotUI(data, {
    data: data,
    rows:       cfg.rows    || [],
    cols:       cfg.cols    || [],
    vals:       cfg.vals    || [],
    aggregatorName: cfg.aggregatorName || 'Sum',
    rendererName:   cfg.rendererName   || 'Table',
    unusedAttrsVertical: false,
    menuLimit: 3000,
    // Note: PivotTable.js always sorts rows alphabetically.
    // To force subtotal rows to appear LAST, use "Σ " prefix on Lane field
    // (Σ sorts after all uppercase letters Z in ASCII, so "Σ AEJEA Total" always comes after "WAT").
  });

  // Enhance: mark row-label th cells and colTotal cells for CSS sticky
  setTimeout(function() {
    var $tbl = $el.find('.pvtTable');
    $tbl.find('tbody th').addClass('pvtRowLabel');
    // subtotal rows (Σ Total)
    $tbl.find('tbody tr').each(function() {
      if (/Σ|Total|汇总/.test($(this).text())) $(this).addClass('subtotal-row');
    });
    // Collapse: only for Port x Lane x Type (tab 3)
    if (cfg.rows && cfg.rows[0] === 'Port') {
      addCollapseHandlers($tbl);
    }
  }, 150);
}

// ─── Collapsible groups (Port x Lane x Type) ─────────────────────────────────
function addCollapseHandlers($tbl) {
  $tbl.find('tbody th[rowspan]').each(function() {
    var $th = $(this);
    var rowspan = parseInt($th.attr('rowspan')) || 1;
    var $groupRows = $th.closest('tr').add(
      $th.closest('tr').nextAll('tr').slice(0, rowspan - 1)
    );

    // Insert collapse arrow
    $th.prepend('<span class="collapse-arrow">▼</span>');

    $th.on('click', function() {
      var collapsed = $th.data('collapsed');
      // Hide all group rows except the port-header row itself
      if (collapsed) {
        $groupRows.show();
        $th.find('.collapse-arrow').text('▼');
        $th.data('collapsed', false);
      } else {
        $groupRows.not($th.closest('tr')).hide();
        $th.find('.collapse-arrow').text('▶');
        $th.data('collapsed', true);
      }
    });
  });
}

// ─── Weekly Chart (Chart.js) ─────────────────────────────────────────────────
function drawWeeklyChart() {
  var weekly = {};
  rawData.forEach(function(r) {
    var w = String(r['Week'] || '');
    if (!w) return;
    if (!weekly[w]) weekly[w] = { 'Actual TEU': 0, 'Booking TEU': 0 };
    weekly[w]['Actual TEU']  += (Number(r['Actual TEU'])  || 0);
    weekly[w]['Booking TEU'] += (Number(r['Booking TEU']) || 0);
  });

  var rows = Object.keys(weekly)
    .sort(function(a, b) {
      return parseInt((a || '').replace(/\D/g, '')) - parseInt((b || '').replace(/\D/g, ''));
    })
    .map(function(w) {
      return { Week: w, 'Actual TEU': weekly[w]['Actual TEU'], 'Booking TEU': weekly[w]['Booking TEU'] };
    });

  var ctx = document.getElementById('chart-weekly-canvas').getContext('2d');
  if (weeklyChart) weeklyChart.destroy();
  weeklyChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: rows.map(function(r) { return r.Week; }),
      datasets: [
        { label: 'Actual TEU',  data: rows.map(function(r) { return r['Actual TEU'];  }), borderColor: '#2c5aa0', backgroundColor: 'rgba(44,90,160,0.1)', fill: true, tension: 0.3, pointRadius: 4 },
        { label: 'Booking TEU', data: rows.map(function(r) { return r['Booking TEU']; }), borderColor: '#e67e22', backgroundColor: 'rgba(230,126,34,0.1)', fill: true, tension: 0.3, pointRadius: 4 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: true },
        tooltip: { callbacks: { label: function(c) { return c.dataset.label + ': ' + c.parsed.y.toLocaleString(); } } }
      },
      scales: {
        y: { beginAtZero: true, title: { display: true, text: 'TEU' } },
        x: { title: { display: true, text: 'Week' } }
      }
    }
  });
}

// ─── Init Dashboard ──────────────────────────────────────────────────────────
function initDashboard() {

  // Pre-compute OB / IB data
  var obData = buildYoYMoM(rawData.filter(function(r) { return r['TYPE'] === 'OUT' || r['TYPE'] === 'T/S OUT'; }));
  var ibData = buildYoYMoM(rawData.filter(function(r) { return r['TYPE'] === 'IN'  || r['TYPE'] === 'T/S IN';  }));

  // Tab 1: Port x Month — render immediately (active tab)
  // Add Port subtotal rows (Lane = "Σ AEJEA Total" etc.)
  var dataWithPortTotals = injectSubtotals(filterYear(rawData, 2026), 'Port');
  makePivot('pv-port-month', dataWithPortTotals, {
    rows: ['Port', 'Lane'],
    cols: ['ATD Month'],
    vals: ['Actual TEU'],
    aggregatorName: 'Sum'
  });
  pvInit['pv-port-month'] = true;

  // Weekly chart — draw once on init (Tab 5 is hidden, chart still renders)
  drawWeeklyChart();

  // Lazy render remaining tabs on first activation
  // Pre-build data variants with subtotals (tabs 1-5 = 2026 only; tabs 6-7 = full data for VS LY)
  var data2026        = filterYear(rawData, 2026);
  var portTotals2026  = injectSubtotals(data2026, 'Port');
  var obTotals        = injectSubtotals(obData,  'Port');
  var ibTotals        = injectSubtotals(ibData,  'Port');

  var tabConfigs = {
    'tab-lane-month':    { divId: 'pv-lane-month',    data: data2026,        config: { rows: ['Lane'],           cols: ['ATD Month'],              vals: ['Actual TEU'],  aggregatorName: 'Sum' } },
    // Tab 3 (Port x Lane x Type): has col dims (TYPE, Load Status) — skip injectSubtotals,
    // PivotTable.js auto-shows Port-column-totals on the right side (no need for Σ rows).
    'tab-port-lane-type':{ divId: 'pv-port-lane-type', data: data2026,        config: { rows: ['Port', 'Lane'],   cols: ['TYPE', 'Load Status'],    vals: ['Actual TEU'],  aggregatorName: 'Sum' } },
    // Tab 4 (Booking vs Actual): has col dim (ATD Month) — same, no Σ injection needed.
    'tab-booking-actual':{ divId: 'pv-booking-actual', data: data2026,        config:{ rows: ['Port', 'Lane'],   cols: ['ATD Month'],              vals: ['Booking TEU'], aggregatorName: 'Sum' } },
    'tab-weekly-trend':  { divId: 'pv-weekly',         data: data2026,        config: { rows: ['Week'],           cols: [],                        vals: ['Actual TEU', 'Booking TEU'], aggregatorName: 'Sum' } },
    // OB/IB keep full data (includes 2025 for VS LY calculation in buildYoYMoM)
    'tab-outbound':      { divId: 'pv-outbound',       data: obTotals, config: { rows: ['Port', 'Lane'],   cols: ['ATD_Year'],              vals: ['Actual TEU'],  aggregatorName: 'Sum' } },
    'tab-inbound':       { divId: 'pv-inbound',        data: ibTotals, config: { rows: ['Port', 'Lane'],  cols: ['ATD_Year'],              vals: ['Actual TEU'],  aggregatorName: 'Sum' } }
  };

  // Listen to tab show events
  document.querySelectorAll('a[data-bs-toggle="tab"]').forEach(function(el) {
    el.addEventListener('shown.bs.tab', function(e) {
      var tabId = e.target.getAttribute('href').replace('#', '');
      var cfg = tabConfigs[tabId];
      if (cfg && !pvInit[cfg.divId]) {
        makePivot(cfg.divId, cfg.data, cfg.config);
        pvInit[cfg.divId] = true;
      }
    });
  });
}

// ─── Load Data ───────────────────────────────────────────────────────────────
fetch('data/pivot_data.zip')
  .then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status + ': pivot_data.zip not found');
    return r.arrayBuffer();
  })
  .then(function(buf) { return JSZip.loadAsync(buf); })
  .then(function(zip) {
    var jf = zip.file('pivot_data.json');
    if (!jf) throw new Error('pivot_data.json not found inside zip');
    return jf.async('string');
  })
  .then(function(txt) { return JSON.parse(txt); })
  .then(function(data) {
    rawData = data;
    initDashboard();
  })
  .catch(function(err) {
    document.body.innerHTML += '<div class="loading" style="color:#dc3545">Failed to load data: ' + err.message + '</div>';
  });
</script>
</body>
</html>
